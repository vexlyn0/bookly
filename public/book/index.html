<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Онлайн-запись — Jazyl</title>
  <meta name="description" content="Онлайн-запись в Jazyl">
  <meta name="theme-color" content="#534AB7" id="pb-theme-color">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/public-booking.css">
</head>
<body class="public-booking-page">
  <div class="pb-loader pb-loader--page" id="pb-loader" aria-live="polite">
    <div class="pb-loader__spinner" aria-hidden="true"></div>
    <p data-i18n="loading">Загрузка…</p>
  </div>

  <div class="pb-error-screen" id="pb-error-screen" hidden>
    <h1 class="pb-error-screen__title" id="pb-error-title" data-i18n="page_unavailable">Страница недоступна</h1>
    <p class="pb-error-screen__text" id="pb-error-text"></p>
  </div>

  <header class="pb-cover" id="pb-cover" hidden>
    <div class="pb-cover__band" aria-hidden="true"></div>
    <div class="pb-cover__inner">
      <div class="pb-logo" id="pb-org-logo" aria-hidden="true">J</div>
      <h1 class="pb-cover__title" id="pb-org-name">—</h1>
      <p class="pb-cover__description" id="pb-org-description"></p>
      <div class="pb-cover__meta" id="pb-org-meta"></div>
      <div class="pb-contacts" id="pb-org-contacts" hidden></div>
    </div>
  </header>

  <div class="pb-body">
  <main class="pb-main">
    <div class="pb-flow" id="pb-flow" hidden>
      <div class="pb-progress" id="pb-steps"></div>
      <section class="pb-panel" id="pb-panel" aria-live="polite"></section>
    </div>

    <section class="pb-panel pb-success" id="pb-success" hidden>
      <div class="pb-success__icon" aria-hidden="true">✓</div>
      <h2 class="pb-success__title" data-i18n="success_title">Вы записаны!</h2>
      <p class="pb-success__status" id="pb-success-status"></p>
      <dl class="pb-success__details" id="pb-success-details"></dl>
      <div class="pb-manage-link" id="pb-manage-link" hidden>
        <p class="pb-manage-link__title" data-i18n="save_link_title">Сохраните ссылку на запись</p>
        <p class="pb-manage-link__text" data-i18n="save_link_text">По ней можно перенести или отменить запись, если планы изменятся.</p>
        <div class="pb-manage-link__actions">
          <a class="btn btn--outline btn--sm" id="pb-manage-whatsapp" href="#" target="_blank" rel="noopener" data-i18n="save_whatsapp">Сохранить в WhatsApp</a>
          <button class="btn btn--ghost btn--sm" type="button" id="pb-manage-copy">Скопировать ссылку</button>
        </div>
      </div>
      <button class="pb-btn pb-btn--ghost" type="button" id="pb-success-restart" data-i18n="book_again">Записаться ещё раз</button>
    </section>
  </main>

  <aside class="pb-info" id="pb-info" hidden></aside>
  </div>

  <div class="pb-lightbox" id="pb-lightbox" hidden>
    <button class="pb-lightbox__close" type="button" data-i18n="close" aria-label="Закрыть">Закрыть</button>
    <img class="pb-lightbox__img" id="pb-lightbox-img" alt="">
  </div>

  <footer class="pb-powered" id="pb-powered" data-i18n-html="powered" hidden>
    Онлайн-запись через <a href="/?utm_source=booking_page" target="_blank" rel="noopener">Jazyl</a> — создайте свою бесплатно
  </footer>

  <script src="/js/public-booking/i18n.js"></script>
  <script src="/js/public-booking/errors.js"></script>
  <script src="/js/public-booking/api.js"></script>
  <script src="/js/public-booking/state.js"></script>
  <script src="/js/public-booking/ui.js"></script>
  <script src="/js/public-booking/app.js"></script>
</body>
</html>
