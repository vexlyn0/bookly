<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля — Bookly</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <aside class="auth-page__panel" aria-hidden="true">
      <div class="auth-page__panel-inner">
        <a href="/" class="logo">
          <span class="logo__mark">B</span>
          Bookly
        </a>
      </div>
    </aside>

    <main class="auth-page__main">
      <div class="auth-card">
        <header class="auth-card__header">
          <a href="/" class="logo auth-card__logo">
            <span class="logo__mark">B</span>
            Bookly
          </a>
          <h1 class="auth-card__title">Забыли пароль?</h1>
          <p class="auth-card__subtitle">Укажите email аккаунта — пришлём ссылку для нового пароля</p>
        </header>

        <form class="auth-form" id="forgot-form" novalidate>
          <label class="field">
            <span class="field__label">Email</span>
            <input class="field__input" type="email" name="email" required autocomplete="email" placeholder="you@company.com">
          </label>

          <p class="alert alert--error" id="forgot-error" role="alert" hidden></p>
          <p class="alert alert--success" id="forgot-success" role="status" hidden></p>

          <div class="auth-form__footer">
            <button class="btn btn--primary btn--full" type="submit" id="forgot-submit">Отправить ссылку</button>
          </div>
        </form>

        <p class="auth-card__switch">
          Вспомнили пароль? <a href="/login" id="forgot-login-link">Войти</a>
        </p>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth/errors.js"></script>
  <script src="/js/auth/ui.js"></script>
  <script src="/js/auth/client.js"></script>
  <script src="/js/pages/password.js"></script>
</body>
</html>
