<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Вход — Jazyl</title>
  <meta property="og:title" content="Вход в Jazyl">
  <meta property="og:description" content="Кабинет салона: записи, мастера, услуги и уведомления в Telegram.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://vibesales.kz/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="Jazyl">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Войдите в панель управления Jazyl">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page auth-page--checking">
    <aside class="auth-page__panel" aria-hidden="true">
      <div class="auth-page__panel-inner">
        <a href="/" class="logo">
          <span class="logo__mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5v3.5M15.5 3.5v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 13.2l2.6 2.6 4.6-5.2" stroke="#F0997B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Jazyl
        </a>

        <blockquote class="auth-page__quote">
          Клиенты записываются сами по ссылке — даже ночью. Мастер узнаёт о записи в Telegram.
          <cite class="auth-page__quote-author">Jazyl · онлайн-запись для салонов Казахстана</cite>
        </blockquote>
      </div>
    </aside>

    <main class="auth-page__main">
      <div class="auth-card">
        <header class="auth-card__header">
          <a href="/" class="logo auth-card__logo">
            <span class="logo__mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5v3.5M15.5 3.5v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 13.2l2.6 2.6 4.6-5.2" stroke="#F0997B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            Jazyl
          </a>
          <h1 class="auth-card__title">Вход в аккаунт</h1>
          <p class="auth-card__subtitle">Введите email и пароль для доступа к панели управления</p>
        </header>

        <button class="btn btn--outline btn--full auth-google" type="button" id="login-google">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Войти через Google
        </button>

        <div class="auth-card__divider">или по почте</div>

        <form class="auth-form" id="login-form" novalidate>
          <label class="field">
            <span class="field__label">Email</span>
            <input
              class="field__input"
              type="email"
              name="email"
              required
              autocomplete="email"
              placeholder="you@company.com"
            >
          </label>

          <label class="field">
            <span class="field__label">Пароль</span>
            <span class="field__password">
              <input
                class="field__input"
                type="password"
                name="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
              >
              <button class="field__eye" type="button" data-toggle-password aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </span>
          </label>

          <p class="auth-form__forgot"><a href="/forgot-password" id="login-forgot-link">Забыли пароль?</a></p>

          <p class="alert alert--error" id="login-error" role="alert" hidden></p>
          <p class="alert alert--success" id="login-info" role="status" hidden></p>
          <button class="btn btn--outline btn--full" type="button" id="login-resend" hidden>Отправить письмо для подтверждения ещё раз</button>

          <div class="auth-form__footer">
            <button class="btn btn--primary btn--full" type="submit" id="login-submit">
              Войти
            </button>
          </div>
        </form>

        <p class="auth-card__switch">
          Нет аккаунта? <a href="/register">Зарегистрироваться</a>
        </p>

        <a class="auth-card__back" href="/">← На главную</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth/errors.js"></script>
  <script src="/js/auth/ui.js"></script>
  <script src="/js/auth/client.js"></script>
  <script src="/js/org/constants.js"></script>
  <script src="/js/org/client.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
