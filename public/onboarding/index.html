<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Создание компании — Jazyl</title>
  <meta name="description" content="Создайте компанию в Jazyl и начните работу">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/onboarding.css">
</head>
<body>
  <div class="onboarding-page onboarding-page--checking">
    <header class="onboarding-header">
      <a href="/" class="logo">
        <span class="logo__mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5v3.5M15.5 3.5v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 13.2l2.6 2.6 4.6-5.2" stroke="#F0997B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Jazyl
      </a>
    </header>

    <main class="onboarding-page__main">
      <div class="onboarding-card">
        <header class="onboarding-card__header">
          <div class="onboarding-card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path d="M3 21h18M5 21V7l7-4 7 4v14"/>
              <path d="M9 21v-6h6v6"/>
            </svg>
          </div>
          <h1 class="onboarding-card__title">Как называется ваш салон?</h1>
          <p class="onboarding-card__subtitle">
            Это название увидят клиенты на странице записи. Поменять его можно в любой момент.
          </p>
        </header>

        <form class="onboarding-form" id="onboarding-form" novalidate>
          <label class="field">
            <span class="field__label">Название салона или ваше имя</span>
            <input
              class="field__input"
              type="text"
              name="name"
              required
              autocomplete="organization"
              placeholder="Например, Nail studio Aru"
              minlength="2"
            >
          </label>

          <label class="field">
            <span class="field__label">Чем занимаетесь</span>
            <select class="field__select" name="businessType" id="business-type" required></select>
          </label>

          <details class="onboarding-tz">
            <summary>Часовой пояс: Казахстан (UTC+5) · изменить</summary>
            <label class="field">
              <span class="field__label">Часовой пояс</span>
              <select class="field__select" name="timezone" id="timezone" required></select>
              <span class="field__hint">По нему считается время записей и напоминаний</span>
            </label>
          </details>

          <p class="alert alert--error" id="onboarding-error" role="alert" hidden></p>

          <button class="btn btn--primary btn--full btn--lg" type="submit" id="onboarding-submit">
            Продолжить
          </button>
        </form>

        <footer class="onboarding-card__footer">
          <p class="onboarding-card__hint">Дальше — услуги, мастера и ссылка для записи. Это займёт пару минут.</p>
        </footer>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth/errors.js"></script>
  <script src="/js/auth/ui.js"></script>
  <script src="/js/auth/client.js"></script>
  <script src="/js/org/constants.js"></script>
  <script src="/js/org/client.js"></script>
  <script src="/js/pages/onboarding.js"></script>
</body>
</html>
