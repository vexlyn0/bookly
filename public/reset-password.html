<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Новый пароль — Jazyl</title>
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <aside class="auth-page__panel" aria-hidden="true">
      <div class="auth-page__panel-inner">
        <a href="/" class="logo">
          <span class="logo__mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5v3.5M15.5 3.5v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 13.2l2.6 2.6 4.6-5.2" stroke="#F0997B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          Jazyl
        </a>
      </div>
    </aside>

    <main class="auth-page__main">
      <div class="auth-card">
        <header class="auth-card__header">
          <a href="/" class="logo auth-card__logo">
            <span class="logo__mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="3.5" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5v3.5M15.5 3.5v3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M8.5 13.2l2.6 2.6 4.6-5.2" stroke="#F0997B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            Jazyl
          </a>
          <h1 class="auth-card__title">Новый пароль</h1>
          <p class="auth-card__subtitle" id="reset-subtitle">Проверяем ссылку…</p>
        </header>

        <form class="auth-form" id="reset-form" novalidate hidden>
          <label class="field">
            <span class="field__label">Новый пароль</span>
            <span class="field__password">
              <input class="field__input" type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Минимум 8 символов">
              <button class="field__eye" type="button" data-toggle-password aria-label="Показать пароль" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </span>
          </label>

          <p class="alert alert--error" id="reset-error" role="alert" hidden></p>

          <div class="auth-form__footer">
            <button class="btn btn--primary btn--full" type="submit" id="reset-submit">Сохранить и войти</button>
          </div>
        </form>

        <div id="reset-invalid" hidden>
          <p class="alert alert--error" id="reset-invalid-text" role="alert"></p>
          <div class="auth-form__footer">
            <a class="btn btn--primary btn--full" href="/forgot-password">Получить новую ссылку</a>
          </div>
        </div>

        <a class="auth-card__back" href="/login">← Ко входу</a>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth/errors.js"></script>
  <script src="/js/auth/ui.js"></script>
  <script src="/js/auth/client.js"></script>
  <script src="/js/org/constants.js"></script>
  <script src="/js/org/client.js"></script>
  <script src="/js/pages/password.js"></script>
</body>
</html>
